# Application
replicaCount: 1

image:
  repository: sungjujjang/dns
  tag: "latest"
  pullPolicy: IfNotPresent

secret:
  enabled: true
  name: "dns-secret"


# MySQL
mysql:
  enabled: false

  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent

  database: app
  username: app

  storage:
    storageClassName: longhorn
    size: 10Gi
