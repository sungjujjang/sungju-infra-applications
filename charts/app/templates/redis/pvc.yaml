{{- if .Values.redis.enabled }}

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ include "app.name" . }}-redis-data

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: {{ .Values.redis.storage.storageClassName }}

  resources:
    requests:
      storage: {{ .Values.redis.storage.size }}

{{- end }}