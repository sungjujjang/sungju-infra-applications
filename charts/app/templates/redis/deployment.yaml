{{- if .Values.redis.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "app.name" . }}-redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ include "app.name" . }}-redis

  template:
    metadata:
      labels:
        app: {{ include "app.name" . }}-redis

    spec:
      containers:
        - name: redis

          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-redis-data

{{- end }}