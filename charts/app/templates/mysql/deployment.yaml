{{- if .Values.mysql.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "app.name" . }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ include "app.name" . }}-mysql

  template:
    metadata:
      labels:
        app: {{ include "app.name" . }}-mysql

    spec:
      containers:
        - name: mysql

          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}

            - name: MYSQL_USER
              value: {{ .Values.mysql.username | quote }}

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.name" . }}-secret
                  key: mysql-password

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.name" . }}-secret
                  key: mysql-root-password

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-mysql-data

{{- end }}