{{- if .Values.ingress.enabled }}

apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ include "app.name" . }}

spec:
  entryPoints:
    {{- toYaml .Values.entryPoints | nindent 4 }}

  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`)

      services:
        - name: {{ include "app.name" . }}
          port: {{ .Values.service.port }}

{{- end }}